name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            output="$(npm audit --omit=dev --audit-level=high 2>&1)"
            status=$?
            echo "$output"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if echo "$output" | grep -Eq '503 Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT'; then
              if [ "$attempt" -lt 3 ]; then
                echo "npm audit service unavailable; retrying ($attempt/3)..."
                sleep $((attempt * 5))
                continue
              fi

              echo "::warning::npm audit service remained unavailable after 3 attempts. Locked production dependencies were installed successfully; Dependabot remains enabled."
              exit 0
            fi

            exit "$status"
          done

      - name: Verify source
        run: npm run check

  browser:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install browser matrix
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser verification
        run: npm run test:e2e

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: marvel-reading-atlas-browser-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
